<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>展示会 ご相談受付｜菱洋株式会社</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --brand: #123f73;
      --brand-dark: #0c2d55;
      --text: #1f2937;
      --muted: #667085;
      --line: #dfe3e8;
      --bg: #f5f7fa;
      --soft: #f8fafc;
      --warn-bg: #fff8e8;
      --warn-line: #f1d58a;
      --danger: #b42318;
      --success: #067647;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.65;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 4px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 2px 12px rgba(16, 24, 40, .06);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      line-height: 1.35;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .lead {
      margin: 0;
      color: var(--muted);
    }

    .field {
      margin: 0 0 20px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #fef3f2;
      color: var(--danger);
      font-size: 11px;
      vertical-align: 1px;
    }

    .optional {
      color: var(--muted);
      font-size: 12px;
      margin-left: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      font: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(18,63,115,.10);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .choices {
      display: grid;
      gap: 9px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
    }

    .choice:hover {
      background: var(--soft);
    }

    .choice input {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .choice strong {
      display: block;
      font-size: 15px;
    }

    .choice small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
    }

    .inline {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      cursor: pointer;
      background: #fff;
    }

    .pill input {
      width: 17px;
      height: 17px;
    }

    .section-title {
      border-top: 1px solid #edf0f3;
      padding-top: 22px;
      margin-top: 22px;
    }

    .slot-list {
      display: grid;
      gap: 9px;
      margin-top: 12px;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px;
      cursor: pointer;
    }

    .slot:hover {
      background: var(--soft);
    }

    .slot input {
      width: 18px;
      height: 18px;
    }

    .notice {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-top: 12px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--brand-dark);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      border-radius: 8px;
      padding: 12px;
      margin-top: 14px;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: var(--success);
    }

    .hidden {
      display: none !important;
    }

    .completion {
      text-align: center;
      padding: 16px 2px;
    }

    .completion h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .completion p {
      color: var(--muted);
      margin: 6px 0;
    }

    .bridge-frame {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
      border: 0;
    }

    @media (max-width: 560px) {
      .wrap {
        padding-top: 16px;
      }

      .card {
        padding: 19px;
        border-radius: 11px;
      }

      h1 {
        font-size: 22px;
      }

      .inline {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .pill {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

  <iframe
    id="bridgeFrame"
    class="bridge-frame"
    aria-hidden="true">
  </iframe>

  <main class="wrap">

    <section class="card">
      <div class="brand">
        菱洋株式会社｜展示会専用
      </div>

      <h1>
        ご相談・お打ち合わせ受付
      </h1>

      <p class="lead">
        ご希望の内容をご入力ください。現地調査・訪問・Web打ち合わせは、空き枠から仮予約できます。
      </p>
    </section>

    <form
      id="form"
      class="card"
      novalidate>

      <div class="field">
        <label class="label" for="company">
          会社名
          <span class="required">必須</span>
        </label>

        <input
          id="company"
          name="company"
          type="text"
          autocomplete="organization"
          maxlength="100"
          required>
      </div>

      <div class="field">
        <label class="label" for="name">
          氏名
          <span class="required">必須</span>
        </label>

        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          maxlength="80"
          required>
      </div>

      <div class="field">
        <label class="label" for="email">
          メールアドレス
          <span class="required">必須</span>
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="150"
          required>
      </div>

      <div class="field">
        <label class="label" for="phone">
          電話番号
          <span class="required">必須</span>
        </label>

        <input
          id="phone"
          name="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          maxlength="30"
          required>
      </div>

      <div class="field section-title">

        <div class="label">
          ご興味のある内容
          <span class="required">必須</span>
        </div>

        <div class="inline">

          <label class="pill">
            <input
              type="checkbox"
              name="interest"
              value="ポリウレア">
            ポリウレア
          </label>

          <label class="pill">
            <input
              type="checkbox"
              name="interest"
              value="レーザークリーニング">
            レーザークリーニング
          </label>

          <label class="pill">
            <input
              type="checkbox"
              name="interest"
              value="その他">
            その他
          </label>

        </div>

      </div>

      <div
        id="otherWrap"
        class="field hidden">

        <label class="label" for="otherDetail">
          その他の内容
          <span class="required">必須</span>
        </label>

        <input
          id="otherDetail"
          type="text"
          maxlength="200"
          placeholder="ご興味のある内容をご入力ください">
      </div>

      <div class="field section-title">

        <div class="label">
          ご希望の対応
          <span class="required">必須</span>
        </div>

        <div class="choices">

          <label class="choice">
            <input
              type="radio"
              name="action"
              value="現地調査・無料見積">

            <span>
              <strong>現地調査・無料見積</strong>
              <small>現地を確認し、無料でお見積りいたします。</small>
            </span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="action"
              value="訪問打ち合わせ">

            <span>
              <strong>訪問打ち合わせ</strong>
              <small>担当者が訪問して詳しくご説明いたします。</small>
            </span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="action"
              value="Web打ち合わせ">

            <span>
              <strong>Web打ち合わせ</strong>
              <small>オンラインでご相談いただけます。</small>
            </span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="action"
              value="図面・写真送付">

            <span>
              <strong>図面・写真送付</strong>
              <small>受付メールへの返信で図面・写真をお送りいただけます。</small>
            </span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="action"
              value="資料送付">

            <span>
              <strong>資料送付</strong>
              <small>製品・工法等の資料をご案内いたします。</small>
            </span>
          </label>

        </div>

      </div>

      <div
        id="locationWrap"
        class="field hidden">

        <label class="label" for="location">
          施工・訪問予定場所
          <span class="required">必須</span>
        </label>

        <input
          id="location"
          type="text"
          maxlength="150"
          placeholder="例：東京都江東区">

        <p class="hint">
          都道府県・市区町村までご入力ください。
        </p>

      </div>

      <div
        id="scheduleWrap"
        class="field hidden">

        <div class="label">
          ご希望の日程
          <span class="required">必須</span>
        </div>

        <p
          id="slotLoading"
          class="hint">
          空き枠を読み込んでいます...
        </p>

        <div
          id="slotList"
          class="slot-list">
        </div>

        <label
          class="slot"
          style="margin-top:9px;">

          <input
            type="radio"
            name="slot"
            value="later">

          <span>
            日程は後日調整する
          </span>
        </label>

        <div class="notice">
          日程は仮受付となります。施工場所・担当者の予定等を確認のうえ、正式な日程をご連絡いたします。
        </div>

      </div>

      <div class="field section-title">

        <label
          class="label"
          for="notes">

          ご相談内容・備考
          <span class="optional">
            任意
          </span>

        </label>

        <textarea
          id="notes"
          maxlength="1000"
          placeholder="ご相談内容やご要望がございましたらご入力ください。">
        </textarea>

      </div>

      <button
        id="submitBtn"
        class="btn btn-primary"
        type="submit">
        送信する
      </button>

      <div
        id="message"
        class="message"
        role="alert">
      </div>

    </form>

    <section
      id="completion"
      class="card hidden completion">

      <h2>
        受付が完了しました
      </h2>

      <p>
        ご入力いただいたメールアドレスへ受付内容をお送りしました。
      </p>

      <p id="completionBooking"></p>

    </section>

  </main>

<script>
(function () {

  'use strict';

  const GAS_WEB_APP_URL =
    'https://script.google.com/macros/s/AKfycbxu45n5UQnpqGUhqIzNJDTZf2m9gcEQS2kfdQ5x6LvtWpqpAxQA6-8DUjRCMTdN6hI/exec';


  const bridgeFrame =
    document.getElementById(
      'bridgeFrame'
    );


  const pending =
    new Map();


  let slots = [];


  /**
   * Apps Scriptからの返答を受信
   */
  window.addEventListener(
    'message',
    function (event) {

      if (
        event.origin !==
          'https://script.google.com' &&
        !event.origin.endsWith(
          '.googleusercontent.com'
        )
      ) {
        return;
      }


      const msg =
        event.data || {};


      if (
        msg.type !==
        'ryoyo-bridge-response'
      ) {
        return;
      }


      const item =
        pending.get(
          msg.requestId
        );


      if (!item) {
        return;
      }


      clearTimeout(
        item.timer
      );


      pending.delete(
        msg.requestId
      );


      if (msg.ok) {

        item.resolve(
          msg.data
        );

      } else {

        item.reject(
          new Error(
            msg.error ||
            '処理に失敗しました。'
          )
        );
      }
    }
  );


  /**
   * Apps Script呼び出し
   */
  function api(
    action,
    ...args
  ) {

    return new Promise(
      function (
        resolve,
        reject
      ) {

        const requestId =
          (
            crypto.randomUUID
              ? crypto.randomUUID()
              : String(Date.now()) +
                Math.random()
          );


        const timer =
          setTimeout(
            function () {

              pending.delete(
                requestId
              );

              reject(
                new Error(
                  '通信に時間がかかっています。ページを再読み込みしてください。'
                )
              );

            },
            15000
          );


        pending.set(
          requestId,
          {
            resolve:
              resolve,

            reject:
              reject,

            timer:
              timer
          }
        );


        /**
         * 空き枠取得はGET
         */
        if (
          action ===
          'getAvailableSlots'
        ) {

          const url =
            GAS_WEB_APP_URL +
            '?bridge=1' +
            '&action=getAvailableSlots' +
            '&requestId=' +
            encodeURIComponent(
              requestId
            ) +
            '&t=' +
            Date.now();


          bridgeFrame.src =
            url;


          return;
        }


        /**
         * 保存・変更・キャンセルはPOST
         */
        const form =
          document.createElement(
            'form'
          );


        form.method =
          'POST';

        form.action =
          GAS_WEB_APP_URL;

        form.target =
          'bridgeFrame';

        form.style.display =
          'none';


        const params = {

          requestId:
            requestId,

          action:
            action,

          payload:
            JSON.stringify(
              args
            )
        };


        Object.keys(
          params
        ).forEach(
          function (key) {

            const input =
              document.createElement(
                'input'
              );

            input.type =
              'hidden';

            input.name =
              key;

            input.value =
              params[key];

            form.appendChild(
              input
            );
          }
        );


        document.body.appendChild(
          form
        );


        form.submit();


        form.remove();
      }
    );
  }


  function formatDate(
    iso
  ) {

    const p =
      String(iso)
        .split('-');


    if (
      p.length !== 3
    ) {

      return iso;
    }


    const d =
      new Date(
        Number(p[0]),
        Number(p[1]) - 1,
        Number(p[2])
      );


    const days = [
      '日',
      '月',
      '火',
      '水',
      '木',
      '金',
      '土'
    ];


    return (
      Number(p[1]) +
      '/' +
      Number(p[2]) +
      '（' +
      days[
        d.getDay()
      ] +
      '）'
    );
  }


  function getAction() {

    const el =
      document.querySelector(
        'input[name="action"]:checked'
      );


    return el
      ? el.value
      : '';
  }


  function updateConditionalFields() {

    const action =
      getAction();


    const isField =
      action ===
        '現地調査・無料見積' ||
      action ===
        '訪問打ち合わせ';


    const isWeb =
      action ===
        'Web打ち合わせ';


    document
      .getElementById(
        'locationWrap'
      )
      .classList
      .toggle(
        'hidden',
        !isField
      );


    document
      .getElementById(
        'scheduleWrap'
      )
      .classList
      .toggle(
        'hidden',
        !(
          isField ||
          isWeb
        )
      );


    if (
      isField ||
      isWeb
    ) {

      renderSlots(
        action
      );
    }
  }


  function renderSlots(
    action
  ) {

    const box =
      document.getElementById(
        'slotList'
      );


    box.innerHTML =
      '';


    let count =
      0;


    const isField =
      action ===
        '現地調査・無料見積' ||
      action ===
        '訪問打ち合わせ';


    const isWeb =
      action ===
        'Web打ち合わせ';


    slots.forEach(
      function (slot) {

        if (
          isField &&
          Number(
            slot.field
          ) > 0
        ) {

          addSlot(
            'field|' +
            slot.date +
            '|終日',

            formatDate(
              slot.date
            ) +
            '（終日）'
          );


          count++;
        }


        if (
          isWeb &&
          Number(
            slot.webAM
          ) > 0
        ) {

          addSlot(
            'web|' +
            slot.date +
            '|AM',

            formatDate(
              slot.date
            ) +
            ' 午前'
          );


          count++;
        }


        if (
          isWeb &&
          Number(
            slot.webPM
          ) > 0
        ) {

          addSlot(
            'web|' +
            slot.date +
            '|PM',

            formatDate(
              slot.date
            ) +
            ' 午後'
          );


          count++;
        }
      }
    );


    document
      .getElementById(
        'slotLoading'
      )
      .textContent =
      count
        ? '現在受付可能な日程からお選びください。'
        : '現在表示できる空き枠がありません。「日程は後日調整する」をお選びください。';


    function addSlot(
      value,
      label
    ) {

      const el =
        document.createElement(
          'label'
        );


      el.className =
        'slot';


      el.innerHTML =
        '<input type="radio" name="slot" value="' +
        value +
        '"><span></span>';


      el
        .querySelector(
          'span'
        )
        .textContent =
        label;


      box.appendChild(
        el
      );
    }
  }


  function showMessage(
    text,
    ok
  ) {

    const el =
      document.getElementById(
        'message'
      );


    el.className =
      'message ' +
      (
        ok
          ? 'success'
          : 'error'
      );


    el.textContent =
      text;
  }


  document
    .querySelectorAll(
      'input[name="action"]'
    )
    .forEach(
      function (el) {

        el.addEventListener(
          'change',
          updateConditionalFields
        );
      }
    );


  document
    .querySelectorAll(
      'input[name="interest"]'
    )
    .forEach(
      function (el) {

        el.addEventListener(
          'change',
          function () {

            const other =
              Array
                .from(
                  document.querySelectorAll(
                    'input[name="interest"]:checked'
                  )
                )
                .some(
                  function (x) {
                    return (
                      x.value ===
                      'その他'
                    );
                  }
                );


            document
              .getElementById(
                'otherWrap'
              )
              .classList
              .toggle(
                'hidden',
                !other
              );
          }
        );
      }
    );


  document
    .getElementById(
      'form'
    )
    .addEventListener(
      'submit',
      async function (
        event
      ) {

        event.preventDefault();


        const interests =
          Array
            .from(
              document.querySelectorAll(
                'input[name="interest"]:checked'
              )
            )
            .map(
              function (x) {
                return x.value;
              }
            );


        const action =
          getAction();


        const isField =
          action ===
            '現地調査・無料見積' ||
          action ===
            '訪問打ち合わせ';


        const needsSchedule =
          isField ||
          action ===
            'Web打ち合わせ';


        const selectedSlot =
          document.querySelector(
            'input[name="slot"]:checked'
          );


        const otherDetail =
          document
            .getElementById(
              'otherDetail'
            )
            .value
            .trim();


        if (
          !document
            .getElementById(
              'company'
            )
            .value
            .trim() ||

          !document
            .getElementById(
              'name'
            )
            .value
            .trim() ||

          !document
            .getElementById(
              'email'
            )
            .value
            .trim() ||

          !document
            .getElementById(
              'phone'
            )
            .value
            .trim()
        ) {

          showMessage(
            '会社名・氏名・メールアドレス・電話番号を入力してください。',
            false
          );

          return;
        }


        if (
          !interests.length
        ) {

          showMessage(
            'ご興味のある内容を選択してください。',
            false
          );

          return;
        }


        if (
          interests.includes(
            'その他'
          ) &&
          !otherDetail
        ) {

          showMessage(
            '「その他」の内容を入力してください。',
            false
          );

          return;
        }


        if (!action) {

          showMessage(
            'ご希望の対応を選択してください。',
            false
          );

          return;
        }


        if (
          isField &&
          !document
            .getElementById(
              'location'
            )
            .value
            .trim()
        ) {

          showMessage(
            '施工・訪問予定場所を入力してください。',
            false
          );

          return;
        }


        if (
          needsSchedule &&
          !selectedSlot
        ) {

          showMessage(
            'ご希望の日程を選択してください。',
            false
          );

          return;
        }


        const data = {

          company:
            document
              .getElementById(
                'company'
              )
              .value
              .trim(),

          name:
            document
              .getElementById(
                'name'
              )
              .value
              .trim(),

          email:
            document
              .getElementById(
                'email'
              )
              .value
              .trim(),

          phone:
            document
              .getElementById(
                'phone'
              )
              .value
              .trim(),

          interests:
            interests,

          otherDetail:
            otherDetail,

          action:
            action,

          location:
            document
              .getElementById(
                'location'
              )
              .value
              .trim(),

          slot:
            needsSchedule
              ? selectedSlot.value
              : '',

          notes:
            document
              .getElementById(
                'notes'
              )
              .value
              .trim()
        };


        const btn =
          document.getElementById(
            'submitBtn'
          );


        btn.disabled =
          true;

        btn.textContent =
          '送信中...';


        document
          .getElementById(
            'message'
          )
          .className =
          'message';


        try {

          const result =
            await api(
              'submitCustomerApplication',
              data
            );


          document
            .getElementById(
              'form'
            )
            .classList
            .add(
              'hidden'
            );


          document
            .getElementById(
              'completion'
            )
            .classList
            .remove(
              'hidden'
            );


          document
            .getElementById(
              'completionBooking'
            )
            .textContent =
            result &&
            result.hasBooking

              ? '仮予約日：' +
                result.bookingText

              : '日程については担当者より改めてご連絡いたします。';


          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });


        } catch (
          error
        ) {

          showMessage(
            error.message ||
            String(error),
            false
          );


          try {

            slots =
              await api(
                'getAvailableSlots'
              );


            updateConditionalFields();

          } catch (_) {}


          btn.disabled =
            false;

          btn.textContent =
            '送信する';
        }
      }
    );


  (async function loadInitialSlots() {

    try {

      slots =
        await api(
          'getAvailableSlots'
        );


      document
        .getElementById(
          'slotLoading'
        )
        .textContent =
        'ご希望の対応を選択すると、空き枠が表示されます。';


    } catch (
      error
    ) {

      console.error(
        error
      );


      document
        .getElementById(
          'slotLoading'
        )
        .textContent =
        '空き枠を取得できませんでした。ページを再読み込みしてください。';
    }

  })();

})();
</script>

</body>
</html>
